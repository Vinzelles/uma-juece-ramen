name: Build Ramen Android

on:
  push:
    branches: [main, 'workbench/*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer available from sdkmanager.
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: aarch64-linux-android
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Validate wrapper and packaging regression tests
        run: |
          python -c "import hashlib,json,pathlib; p=pathlib.Path('.'); expected=json.loads((p/'toolchains.json').read_text())['gradle_wrapper_sha256']; assert hashlib.sha256((p/'gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()==expected"
          python -m unittest discover -s scripts/tests -v
      - name: Reconstruct the reviewed engine source and exact data version
        run: python scripts/prepare_engine.py --package-data
      - name: Shared runtime and review tests
        working-directory: .engine-source
        run: cargo test --release --locked -p umaai_runtime -p umaai_review
      - name: JNI tests
        run: cargo test --release --locked --manifest-path rust/Cargo.toml
      - name: Native build, Java tests and APK verification
        run: python scripts/build_android.py --skip-prepare
      - name: Collect immutable provenance
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          cp app/src/main/assets/build-manifest.json dist/
          cp engine/source-lock.json dist/
          sha256sum dist/*.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-arm64-dev-verified
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ramen-build-test-reports
          path: app/build/reports/
          if-no-files-found: ignore
